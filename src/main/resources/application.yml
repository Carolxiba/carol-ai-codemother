spring:
  application:
    name: carol-ai-code-mother
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/carol_ai_code_mother
    username: root
    password: 1234
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.carol.carolaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      max-tokens: 8192
      #      strict-json-schema: true
      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      max-tokens: 8192
      #strict-json-schema: true
#      response-format: json_object

