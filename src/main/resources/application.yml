spring:
  #session配置
  session:
    store-type: redis
    #30天过期
    timeout: 2592000
  application:
    name: carol-ai-code-mother
  #redis
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0
  # mysql
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/carol_ai_code_mother
    username: root
    password: 1234
  profiles:
    active: local
server:
  port: 8123
  servlet:
    context-path: /api
    # cookie30天过期
    session:
      cookie:
        max-age: 2592000
# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.carol.carolaicodemother.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
# AI
langchain4j:
  open-ai:
    chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      max-tokens: 8192
      #      strict-json-schema: true
#      response-format: json_object
    streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-flash
      log-requests: true
      log-responses: true
      max-tokens: 8192
    # 推理 AI 模型配置（用于复杂的推理任务）
    reasoning-streaming-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-v4-pro
      max-tokens: 32768
      temperature: 0.1
      log-requests: true
      log-responses: true
    # 智能路由 AI 模型配置（用于简单的分类任务）
    routing-chat-model:
      base-url: https://api.deepseek.com
      api-key: ${ai.deepseek.api-key}
      model-name: deepseek-flash
      log-requests: true
      log-responses: true

      #strict-json-schema: true
#      response-format: json_object
# 添加 COS 对象存储配置（需要从腾讯云获取）
cos:
  client:
    host: ${tencent.host}
    secretId: ${tencent.secretId}
    secretKey: ${tencent.secretKey}
    region: ${tencent.region}
    bucket: ${tencent.bucket}
pexels:
  api-key: your-api-key
